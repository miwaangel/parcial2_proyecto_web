server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: cualquier ruta (/login, /admin/solicitudes...) carga index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos compilados llevan hash en el nombre: se pueden guardar en cache
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
